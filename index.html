<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shame Denton — Worst Restaurant Health Scores</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 0.25rem;
      font-size: 1.75rem;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    #cards {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .card .score {
      font-size: 2.5rem;
      font-weight: 700;
      color: #c0392b;
      min-width: 4rem;
      text-align: center;
      line-height: 1;
    }

    .card .details {
      flex: 1;
    }

    .card .name {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }

    .card .address {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
    }

    .card .date {
      color: #888;
      font-size: 0.85rem;
    }

    #error {
      display: none;
      background: #fdf2f2;
      border: 1px solid #e74c3c;
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
      color: #c0392b;
    }

    #error a {
      color: #c0392b;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.4rem; }
      .card { padding: 1rem; gap: 1rem; }
      .card .score { font-size: 2rem; min-width: 3rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Shame Denton</h1>
    <p class="subtitle">Worst restaurant health inspection scores in the last 18 months</p>
    <div id="cards"></div>
    <div id="error">
      <p>Unable to load inspection data.</p>
      <p>Visit the <a href="https://data.cityofdenton.com">City of Denton data portal</a> directly.</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      const cardsEl = document.getElementById('cards');
      const errorEl = document.getElementById('error');

      const sql = `SELECT "Name", "Address", "HealthScoreInt", "HealthScoreDate", "Lat", "Long"
FROM (
  SELECT DISTINCT ON ("Name", "Address")
    "Name", "Address", "HealthScoreInt"::int AS "HealthScoreInt",
    "HealthScoreDate", "Lat", "Long"
  FROM "b596e52a-0f84-4766-b376-be9e3ee0b6df"
  WHERE "HealthScoreDate" >= to_char(CURRENT_DATE - INTERVAL '18 months', 'YYYYMMDD')
  ORDER BY "Name", "Address", "HealthScoreDate" DESC
) latest
ORDER BY "HealthScoreInt" ASC
LIMIT 3`;

      try {
        const url = 'https://data.cityofdenton.com/api/3/action/datastore_search_sql?sql=' + encodeURIComponent(sql);
        const res = await fetch(url);
        if (!res.ok) throw new Error('API returned ' + res.status);
        const data = await res.json();
        const records = data.result.records;

        for (const record of records) {
          const card = document.createElement('div');
          card.className = 'card';
          card.setAttribute('data-lat', record.Lat ?? '');
          card.setAttribute('data-long', record.Long ?? '');

          const raw = String(record.HealthScoreDate).slice(0, 8);
          const formatted = raw.slice(4, 6) + '/' + raw.slice(6, 8) + '/' + raw.slice(0, 4);

          card.innerHTML =
            '<div class="score">' + record.HealthScoreInt + '</div>' +
            '<div class="details">' +
              '<div class="name">' + escapeHtml(record.Name) + '</div>' +
              '<div class="address">' + escapeHtml(record.Address) + '</div>' +
              '<div class="date">Inspected ' + formatted + '</div>' +
            '</div>';

          cardsEl.appendChild(card);
        }
      } catch (e) {
        cardsEl.style.display = 'none';
        errorEl.style.display = 'block';
      }
    });

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }
  </script>
</body>
</html>
